<!DOCTYPE html>
<html>
<body>
<canvas id="icon" width="512" height="512"></canvas>
<script>
const canvas = document.getElementById('icon');
const ctx = canvas.getContext('2d');

// Background
const gradient = ctx.createLinearGradient(0, 0, 512, 512);
gradient.addColorStop(0, '#1a1a2e');
gradient.addColorStop(1, '#16213e');
ctx.fillStyle = gradient;
ctx.fillRect(0, 0, 512, 512);

// Sword
ctx.strokeStyle = '#ffd700';
ctx.lineWidth = 20;
ctx.lineCap = 'round';
ctx.beginPath();
ctx.moveTo(150, 350);
ctx.lineTo(350, 150);
ctx.stroke();

// Sword handle
ctx.fillStyle = '#8B4513';
ctx.fillRect(120, 360, 80, 30);

// Monster
ctx.fillStyle = '#ff4444';
ctx.beginPath();
ctx.arc(380, 380, 60, 0, Math.PI * 2);
ctx.fill();

// Eyes
ctx.fillStyle = '#fff';
ctx.beginPath();
ctx.arc(365, 370, 10, 0, Math.PI * 2);
ctx.arc(395, 370, 10, 0, Math.PI * 2);
ctx.fill();

console.log('Icon created. Right-click and save as icon.png');
</script>
</body>
</html>
