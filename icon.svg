<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="50"/>
  
  <!-- Sword -->
  <line x1="150" y1="350" x2="350" y2="150" stroke="#ffd700" stroke-width="25" stroke-linecap="round"/>
  <rect x="120" y="360" width="80" height="35" fill="#8B4513" rx="5"/>
  <circle cx="160" cy="377" r="15" fill="#FFD700"/>
  
  <!-- Monster -->
  <circle cx="380" cy="380" r="65" fill="#ff4444"/>
  <circle cx="365" cy="365" r="12" fill="#fff"/>
  <circle cx="395" cy="365" r="12" fill="#fff"/>
  <circle cx="365" cy="365" r="6" fill="#000"/>
  <circle cx="395" cy="365" r="6" fill="#000"/>
  
  <!-- Health bar decoration -->
  <rect x="50" y="50" width="150" height="20" fill="#333" rx="10"/>
  <rect x="50" y="50" width="100" height="20" fill="#ff4444" rx="10"/>
  
  <!-- Title -->
  <text x="256" y="480" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#ffd700">DS</text>
</svg>
